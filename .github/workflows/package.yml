name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  package:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup LLVM-MinGW toolchains
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install mingw-mstorsjo-llvm-msvcrt

      - name: Setup Rust targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnullvm
          rustup target add i686-pc-windows-gnullvm

      - name: Configure Rust linkers
        shell: pwsh
        run: |
          $cargoConfig = Join-Path $env:GITHUB_WORKSPACE "native/ListaryOpen.Hooks/.cargo/config.toml"
          $mingwRoot = Join-Path $env:USERPROFILE "scoop/apps/mingw-mstorsjo-llvm-msvcrt/current"
          $mingwBin = (Join-Path $mingwRoot "bin").Replace("\", "/")
          @"
          [build]
          target-dir = "target"

          [target.x86_64-pc-windows-gnullvm]
          linker = "$mingwBin/x86_64-w64-mingw32-clang.exe"

          [target.i686-pc-windows-gnullvm]
          linker = "$mingwBin/i686-w64-mingw32-clang.exe"
          "@ | Set-Content -Path $cargoConfig -Encoding utf8

      - name: Restore
        shell: pwsh
        run: dotnet restore ListaryOpen.sln -r win-x64

      - name: Test
        shell: pwsh
        run: |
          $testOutput = dotnet test ListaryOpen.sln `
            -c Release `
            --no-restore `
            --nologo `
            -p:BuildNativeHooks=false 2>&1 | Tee-Object -Variable capturedOutput
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            $details = ($capturedOutput | Select-Object -Last 100) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Test failure::$details"
            exit $exitCode
          }

      - name: Publish app with native hooks
        shell: pwsh
        run: |
          Remove-Item artifacts\ListaryOpen -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish src\ListaryOpen.App\ListaryOpen.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            --no-restore `
            -p:BuildNativeHooks=true `
            -o artifacts\ListaryOpen

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "artifacts\ListaryOpen\ListaryOpen.App.exe",
            "artifacts\ListaryOpen\ListaryOpen.Indexer.Elevated.exe",
            "artifacts\ListaryOpen\hooks\x64\ListaryOpen.HookHost.exe",
            "artifacts\ListaryOpen\hooks\x64\ListaryOpen.Hook.dll",
            "artifacts\ListaryOpen\hooks\x64\libunwind.dll",
            "artifacts\ListaryOpen\hooks\x86\ListaryOpen.HookHost.exe",
            "artifacts\ListaryOpen\hooks\x86\ListaryOpen.Hook.dll",
            "artifacts\ListaryOpen\hooks\x86\libunwind.dll"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required package file is missing: $path"
            }
          }

      - name: Create zip package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts\ListaryOpen\* `
            -DestinationPath artifacts\ListaryOpen-win-x64.zip `
            -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ListaryOpen-win-x64
          path: artifacts/ListaryOpen-win-x64.zip
          if-no-files-found: error
