name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  package:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup LLVM-MinGW toolchains
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install mingw-mstorsjo-llvm-msvcrt

      - name: Setup Rust targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnullvm
          rustup target add i686-pc-windows-gnullvm

      - name: Run automated acceptance and package
        shell: pwsh
        run: tools\Invoke-AutomatedAcceptance.ps1 -SkipDesktopE2E

      - name: Verify and archive Windows package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "artifacts\ListaryOpen"
          $zip = Join-Path $PWD "artifacts\ListaryOpen-win-x64.zip"
          $required = @(
            "ListaryOpen.App.exe",
            "ListaryOpen.App.dll",
            "ListaryOpen.PreviewHost.exe",
            "ListaryOpen.PreviewHost.dll",
            "ListaryOpen.Indexer.Elevated.exe",
            "MsgReader.dll",
            "XstReader.Api.dll",
            "OpenMcdf.dll",
            "RtfPipe.dll",
            "UtfUnknown.dll",
            "Microsoft.IO.RecyclableMemoryStream.dll",
            "Microsoft.Maui.Graphics.dll",
            "Microsoft.Bcl.Cryptography.dll",
            "System.Formats.Asn1.dll",
            "System.Security.Cryptography.Pkcs.dll",
            "SharpCompress.dll",
            "ExcelDataReader.dll",
            "K4os.Compression.LZ4.Streams.dll",
            "K4os.Compression.LZ4.dll",
            "K4os.Hash.xxHash.dll",
            "System.IO.Pipelines.dll",
            "plist-cil.dll",
            "pdfium.dll",
            "THIRD-PARTY-NOTICES.txt",
            "hooks\x64\ListaryOpen.Hook.dll",
            "hooks\x64\ListaryOpen.HookHost.exe",
            "hooks\x86\ListaryOpen.Hook.dll",
            "hooks\x86\ListaryOpen.HookHost.exe"
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $package $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required package file is missing: $path"
            }
          }
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          $packageData = [System.IO.Path]::GetFullPath((Join-Path $package "data"))
          $archiveItems = @(
            Get-ChildItem -LiteralPath $package -Force |
              Where-Object {
                -not ([System.IO.Path]::GetFullPath($_.FullName).Equals(
                  $packageData,
                  [System.StringComparison]::OrdinalIgnoreCase))
              } |
              ForEach-Object { $_.FullName }
          )
          if ($archiveItems.Count -eq 0) {
            throw "No distributable files were found in '$package'."
          }
          Compress-Archive -LiteralPath $archiveItems -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or (Get-Item -LiteralPath $zip).Length -le 0) {
            throw "Package archive was not created: $zip"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $localDataEntries = @(
              $archive.Entries |
                Where-Object { $_.FullName.Replace('\', '/').StartsWith("data/", [System.StringComparison]::OrdinalIgnoreCase) }
            )
            if ($localDataEntries.Count -gt 0) {
              throw "ZIP must not contain local index data: $($localDataEntries[0].FullName)"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ListaryOpen-acceptance-results
          path: artifacts/acceptance-results
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ListaryOpen-win-x64
          path: artifacts/ListaryOpen-win-x64.zip
          if-no-files-found: error
