name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  package:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup LLVM-MinGW toolchains
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install mingw-mstorsjo-llvm-msvcrt

      - name: Setup Rust targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnullvm
          rustup target add i686-pc-windows-gnullvm

      - name: Run automated acceptance and package
        continue-on-error: true
        shell: pwsh
        run: tools\Invoke-AutomatedAcceptance.ps1

      - name: Verify and archive Windows package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "artifacts\ListaryOpen"
          $zip = Join-Path $PWD "artifacts\ListaryOpen-win-x64.zip"
          $required = @(
            "ListaryOpen.App.exe",
            "ListaryOpen.App.dll",
            "ListaryOpen.Indexer.Elevated.exe",
            "hooks\x64\ListaryOpen.Hook.dll",
            "hooks\x64\ListaryOpen.HookHost.exe",
            "hooks\x86\ListaryOpen.Hook.dll",
            "hooks\x86\ListaryOpen.HookHost.exe"
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $package $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required package file is missing: $path"
            }
          }
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or (Get-Item -LiteralPath $zip).Length -le 0) {
            throw "Package archive was not created: $zip"
          }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ListaryOpen-acceptance-results
          path: artifacts/acceptance-results
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ListaryOpen-win-x64
          path: artifacts/ListaryOpen-win-x64.zip
          if-no-files-found: error
